apiVersion: v2
name: bytebase
version: 1.1.4-dc3
description: Safe database schema change and version control for DevOps teams.
type: application
home: https://www.bytebase.com/
# sources[0] becomes the package's org.opencontainers.image.source, which links the
# GHCR package to its consumer cosmos-charts (as every datacosmos-br chart fork is),
# so the cosmos-charts workflows can read it.
sources:
  - https://github.com/datacosmos-br/cosmos-charts
  - https://github.com/datacosmos-br/bytebase-charts
  - https://github.com/bytebase/bytebase
icon: https://raw.githubusercontent.com/bytebase/bytebase.com/main/public/images/logo.svg
maintainers:
  - name: Bytebase
    email: support@bytebase.com
